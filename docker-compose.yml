
services:
  matomo-db:
    container_name: matomo-db
    image: mariadb:10.11
#    mem_limit: ${MEM_LIMIT}
#    memswap_limit: ${MEM_LIMIT}
#    cpus: ${CPU_LIMIT}
    command: --max-allowed-packet=64MB
    restart: unless-stopped
    volumes:
      - ./volumes/matomo-db/data:/var/lib/mysql:Z
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MARIADB_AUTO_UPGRADE: ${MATOMO_DB_AUTO_UPGRADE}
      MARIADB_INITDB_SKIP_TZINFO: ${MATOMO_DB_INITDB_SKIP_TZINFO}
      MARIADB_DISABLE_UPGRADE_BACKUP: ${MATOMO_DB_DISABLE_UPGRADE_BACKUP}

  matomo-db-dumper:
    image: tiredofit/db-backup:4.1.17
    container_name: matomo-db-dumper
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT}
    memswap_limit: ${MEM_LIMIT}
    cpus: ${CPU_LIMIT}
    volumes:
        - ./volumes/matomo-db/dump/:/backup/
        - ./volumes/matomo-db-dumper/script/:/assets/scripts/post/:w
    depends_on:
        - matomo-db
    environment:
      # DB_DUMP_BEGIN: "0130" <= tous les jours à 1h30 du matin GMT
      # DB_DUMP_FREQ: 1440 <= chaque jour
      # DB_CLEANUP_TIME: 10080 (1440*7) <= conserve uniquement les 7 derniers jours
      DB_TYPE: "pgsql"
      DB_HOST: "matomo-db"
      DB_NAME: "matomo"
      DB_USER: ${MATOMO_DB_USER}
      DB_PASS: ${MATOMO_DB_PASSWORD}
      DEFAULT_BACKUP_BEGIN: "0130"
      DEFAULT_BACKUP_INTERVAL: 1440
      DEFAULT_CLEANUP_TIME: 10080
      DEFAULT_COMPRESSION: "GZ"
      DEBUG_MODE: "false"
      CONTAINER_ENABLE_SCHEDULING: "false"
      CONTAINER_ENABLE_MONITORING: "false"
      # GROUP_DBBACKUP : donne le groupe docker aux fichiers de backup
      GROUP_DBBACKUP: "564406605"
      DEFAULT_FILESYSTEM_PERMISSION: 440
      DEFAULT_FILESYSTEM_PATH_PERMISSION: 775
 
  matomo-app:
    build: .
    container_name: matomo-app
    image: matomo-5.1.2-fpm-alpine
      #    mem_limit: ${MEM_LIMIT}
      #    memswap_limit: ${MEM_LIMIT}
      #    cpus: ${CPU_LIMIT}
    restart: unless-stopped
    links:
      - matomo-db
    volumes:
      - ./configs/matomo-app/config:/var/www/html/config:z
      - ./volumes/matomo-app/logs:/var/www/html/logs:z
      - ./volumes/matomo-app/www:/var/www/html:z
      - ./configs/matomo-app/plugins:/var/www/html/plugins:z
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: _matomo
      MATOMO_DATABASE_USERNAME: ${MATOMO_APP_USERNAME}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: ${MATOMO_APP_DBNAME}
      PHP_MEMORY_LIMIT: 2048Ma
  matomo-cron:
    image: matomo-5.1.2-fpm-alpine
    container_name: matomo-cron
    restart: unless-stopped
    entrypoint: /usr/sbin/crond
    command: ["-f", "-l", "2", "-L", "/dev/stdout"]
    volumes:
      - ./configs/matomo-app/config:/var/www/html/config:z
      - ./volumes/matomo-app/logs:/var/www/html/logs:z
      - ./volumes/matomo-app/www:/var/www/html:z
      - ./configs/matomo-app/plugins:/var/www/html/plugins:z


  matomo-web:
    container_name: matomo-web
    image: nginx:1.27-alpine
      #    mem_limit: ${MEM_LIMIT}
      #    memswap_limit: ${MEM_LIMIT}
      #    cpus: ${CPU_LIMIT}
    restart: unless-stopped
    volumes:
      - ./volumes/matomo-app/www:/var/www/html:z
      - ./configs/matomo-app/config:/var/www/html/config:z
      - ./configs/matomo-app/plugins:/var/www/html/plugins:z
      # see https://github.com/matomo-org/matomo-nginx
      - ./configs/matomo-web/config/matomo.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - ${MATOMO_WEB_PORT}:80

