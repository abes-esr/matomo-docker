
services:
  matomo-db:
    container_name: matomo-db
    image: mariadb:10.11
#    mem_limit: ${MEM_LIMIT}
#    memswap_limit: ${MEM_LIMIT}
#    cpus: ${CPU_LIMIT}
    command: --max-allowed-packet=64MB
    restart: unless-stopped
    volumes:
      - ./volumes/matomo-db/data:/var/lib/mysql:Z
    environment:
      MYSQL_ROOT_PASSWORD: ${MATOMO_DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${MATOMO_DB_PASSWORD}
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MARIADB_AUTO_UPGRADE: ${MATOMO_DB_AUTO_UPGRADE}
      MARIADB_INITDB_SKIP_TZINFO: ${MATOMO_DB_INITDB_SKIP_TZINFO}
      MARIADB_DISABLE_UPGRADE_BACKUP: ${MATOMO_DB_DISABLE_UPGRADE_BACKUP}

  matomo-app:
    build: .
    container_name: matomo-app
    image: matomo-5.1.2-fpm-alpine
      #    mem_limit: ${MEM_LIMIT}
      #    memswap_limit: ${MEM_LIMIT}
      #    cpus: ${CPU_LIMIT}
    restart: unless-stopped
    links:
      - matomo-db
    volumes:
      - ./configs/matomo-app/config:/var/www/html/config:z
      - ./volumes/matomo-app/logs:/var/www/html/logs:z
      - ./volumes/matomo-app/www:/var/www/html:z
      - ./configs/matomo-app/plugins:/var/www/html/plugins:z
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: _matomo
      MATOMO_DATABASE_USERNAME: ${MATOMO_APP_USERNAME}
      MATOMO_DATABASE_PASSWORD: ${MATOMO_DB_PASSWORD}
      MATOMO_DATABASE_DBNAME: ${MATOMO_APP_DBNAME}
      PHP_MEMORY_LIMIT: 2048Ma
  matomo-cron:
    image: matomo-5.1.2-fpm-alpine
    container_name: matomo-cron
    restart: unless-stopped
    entrypoint: /usr/sbin/crond
    command: ["-f", "-l", "2", "-L", "/dev/stdout"]
    volumes:
      - ./configs/matomo-app/config:/var/www/html/config:z
      - ./volumes/matomo-app/logs:/var/www/html/logs:z
      - ./volumes/matomo-app/www:/var/www/html:z
      - ./configs/matomo-app/plugins:/var/www/html/plugins:z


  matomo-web:
    container_name: matomo-web
    image: nginx:1.27-alpine
      #    mem_limit: ${MEM_LIMIT}
      #    memswap_limit: ${MEM_LIMIT}
      #    cpus: ${CPU_LIMIT}
    restart: unless-stopped
    volumes:
      - ./volumes/matomo-app/www:/var/www/html:z
      - ./configs/matomo-app/config:/var/www/html/config:z
      - ./configs/matomo-app/plugins:/var/www/html/plugins:z
      # see https://github.com/matomo-org/matomo-nginx
      - ./configs/matomo-web/config/matomo.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - ${MATOMO_WEB_PORT}:80

